name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build:
    name: Build ${{ matrix.name }}
    needs: analyze-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            os: ubuntu-latest
            target: android
            build_target: apk
            artifact_name: rawviewer-android-apk
            artifact_path: build/app/outputs/flutter-apk/app-release.apk
          - name: Linux
            os: ubuntu-latest
            target: linux
            build_target: linux
            artifact_name: rawviewer-linux-x64
            artifact_path: build/linux/x64/release/bundle
          - name: Windows
            os: windows-latest
            target: windows
            build_target: windows
            artifact_name: rawviewer-windows-x64
            artifact_path: build/windows/x64/runner/Release
          - name: macOS
            os: macos-latest
            target: macos
            build_target: macos
            artifact_name: rawviewer-macos
            artifact_path: build/macos/Build/Products/Release/rawviewer.app
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Enable macOS desktop
        if: matrix.target == 'macos'
        run: flutter config --enable-macos-desktop

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        shell: bash
        run: flutter build ${{ matrix.build_target }} --release

      - name: Check macOS file associations
        if: matrix.target == 'macos'
        shell: bash
        run: |
          swiftc macos/Runner/FileAssociations.swift tool/macos_file_association_check.swift -o "$RUNNER_TEMP/rawviewer-association-check"
          "$RUNNER_TEMP/rawviewer-association-check"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 7
